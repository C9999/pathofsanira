<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>v 0.2 — Path of Sanira — V2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#14122B;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#F5EFE0}
#stage{position:absolute;width:844px;height:390px;transform-origin:0 0;overflow:hidden;background:#A9D8EE}
#c{position:absolute;left:0;top:0;width:844px;height:390px}
#tb{position:absolute;left:22px;bottom:22px;width:78px;height:78px;border-radius:50%;background:rgba(232,96,76,.9);border:2px solid rgba(255,255,255,.8);display:none;align-items:center;justify-content:center;flex-direction:column;font-size:12px;font-weight:700;letter-spacing:.06em;color:#fff;cursor:pointer;line-height:1.2}
#jb{position:absolute;right:22px;bottom:22px;width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(62,53,82,.5);display:none;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.08em;color:#3E3552;pointer-events:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,18,43,.94);text-align:center}
.off{display:none!important}
h1{margin:0;font:600 34px Georgia,serif;letter-spacing:.04em}
h2{margin:0;font:600 22px Georgia,serif}
p{margin:0;font-size:14px;color:#CFC8E8}.hint{margin-top:10px;color:#E8C46A;font-size:13px}
button{padding:11px 26px;border:0;border-radius:10px;background:#E8C46A;color:#14122B;font:700 15px system-ui,sans-serif;cursor:pointer}
button.alt{background:#2E2760;color:#F5EFE0;border:1px solid #6B5FB5}
#cards{display:flex;gap:14px}
.card{width:150px;height:206px;perspective:700px}
.inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;border:1px solid #6B5FB5;background:#211C45;padding:10px;display:flex;flex-direction:column;gap:5px;text-align:left}
.back{background:#2E2760;align-items:center;justify-content:center;font-size:34px;color:#E8C46A}
.front{transform:rotateY(180deg)}
.front.hit{border-color:#E8C46A}
.bar{height:8px;border-radius:4px}
.role{font-size:11px;color:#CFC8E8}
.num{font-size:11px;letter-spacing:.12em;color:#E8C46A;font-weight:700}
.nm{font:600 16px/1.15 Georgia,serif}
.pw{font-size:13px;font-weight:700;color:#FFD98A}
.ds{font-size:12px;line-height:1.3;color:#CFC8E8}
#end .box{width:640px;background:#211C45;border:1px solid #6B5FB5;border-radius:14px;padding:16px 20px;display:flex;flex-direction:column;gap:10px;text-align:left}
.stats{display:flex;gap:10px}
.stat{flex:1;background:#2E2760;border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:#CFC8E8}
.pu{display:flex;align-items:center;gap:10px;font-size:13px;padding:5px 0;border-top:1px solid #3a3470}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.pu small{display:block;color:#CFC8E8;font-size:12px}
#rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#14122B;color:#F5EFE0;font-size:18px;text-align:center;padding:30px;z-index:9}
@media (orientation:portrait){#rot{display:flex}#stage{display:none}}
</style>
</head>
<body>
<div id="rot">Gire o aparelho para a posição deitada</div>
<div id="stage">
<canvas id="c"></canvas>
<div id="jb">PULAR</div>
<div id="tb"><span style="font-size:22px">⚡</span>RAIO</div>
<div id="menu" class="scr"><h1>Path of Sanira</h1><p>Uma sessão de meditação começa com três cartas.</p><p class="hint">Toque em qualquer lugar para tirar as cartas</p></div>
<div id="draw" class="scr off"><h2>Sua tiragem</h2><div id="cards"></div><button id="go" class="off">Começar a meditar</button></div>
<div id="end" class="scr off"></div>
<div id="countdown" class="scr off"><h2>Prepare-se para meditar</h2><div id="count" style="font:600 64px Georgia,serif;color:#E8C46A">5</div><p>Sanira começará a se mover em instantes</p></div>
<div id="pause" class="scr off"><h2>Sessão de meditação pausada</h2><button id="resume">Continuar</button></div>
<button id="pauseBtn" class="alt" style="position:absolute;right:112px;top:18px;display:none;padding:8px 12px;font-size:12px">Pausar</button>
<button id="powerBtn" style="position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;border-radius:50%;width:66px;height:66px;padding:6px;font-size:11px">PODER</button>
<div id="audioBtn" style="position:absolute;right:16px;bottom:16px;display:none;color:#3E3552;background:rgba(255,255,255,.7);padding:7px 10px;border-radius:12px;font-size:11px">Áudio: ligado</div>
</div>
<script>
const W=844,H=390,PX=190,S0=0.55,SLOPE=0.15;
const SVG_HEAD='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">';
const SVG_AURA={forca:`<g id="aura-forca">
<ellipse cx="120" cy="116" rx="94" ry="100" fill="#F9C784" opacity="0.35"/>
<ellipse cx="120" cy="116" rx="80" ry="86" fill="#F4A259" opacity="0.45"/>
<ellipse cx="120" cy="116" rx="80" ry="86" fill="none" stroke="#F28C28" stroke-width="3" opacity="0.85"/>
</g>`,normal:`<g id="aura-normal">
<ellipse cx="120" cy="116" rx="86" ry="92" fill="#EEF0F4" opacity="0.45"/>
<ellipse cx="120" cy="116" rx="86" ry="92" fill="none" stroke="#D5DAE3" stroke-width="2"/>
</g>`};
const SVG_FACE={feliz:`<g id="rosto-feliz">
<path d="M104 50q5-3 11-1M125 49q6-2 11 1" stroke="#4A2C20" stroke-width="1.8" stroke-linecap="round" fill="none"/>
<path d="M105 56q5 4 10 0M125 56q5 4 10 0" stroke="#3A241B" stroke-width="1.9" stroke-linecap="round" fill="none"/>
<path d="M119 60q-2 4 1 5" stroke="#9A6240" stroke-width="1.5" stroke-linecap="round" fill="none"/>
<path d="M112 69q8 5 16 0" stroke="#7A3B2E" stroke-width="1.9" stroke-linecap="round" fill="none"/>
<circle cx="104" cy="64" r="3.5" fill="#E58E7A" opacity="0.4"/><circle cx="136" cy="64" r="3.5" fill="#E58E7A" opacity="0.4"/>
</g>`,triste:`<g id="rosto-triste">
<path d="M104 52L115 48M125 48L136 52" stroke="#4A2C20" stroke-width="1.8" stroke-linecap="round" fill="none"/>
<path d="M105 58q5-3 10 0M125 58q5-3 10 0" stroke="#3A241B" stroke-width="1.9" stroke-linecap="round" fill="none"/>
<path d="M119 60q-2 4 1 5" stroke="#9A6240" stroke-width="1.5" stroke-linecap="round" fill="none"/>
<path d="M112 72q8-5 16 0" stroke="#7A3B2E" stroke-width="1.9" stroke-linecap="round" fill="none"/>
<path d="M137 61q3 4 0 7q-3-3 0-7z" fill="#8FC1E8"/>
</g>`};
const SVG_BODY=`<g id="personagem">
<ellipse cx="120" cy="162" rx="44" ry="15" fill="#26262E"/>
<ellipse cx="62" cy="178" rx="32" ry="18" fill="#26262E"/>
<ellipse cx="178" cy="178" rx="32" ry="18" fill="#26262E"/>
<ellipse cx="100" cy="190" rx="40" ry="11" transform="rotate(-8 100 190)" fill="#1E1E25" stroke="#3B3B47" stroke-width="1.5"/>
<ellipse cx="140" cy="190" rx="40" ry="11" transform="rotate(8 140 190)" fill="#1E1E25" stroke="#3B3B47" stroke-width="1.5"/>
<ellipse cx="96" cy="187" rx="13" ry="6" fill="#B87A52"/>
<ellipse cx="144" cy="187" rx="13" ry="6" fill="#B87A52"/>
<circle cx="86" cy="184" r="2" fill="#B87A52"/><circle cx="90" cy="182" r="2" fill="#B87A52"/><circle cx="154" cy="184" r="2" fill="#B87A52"/><circle cx="150" cy="182" r="2" fill="#B87A52"/>
<path d="M84 98Q84 88 98 86L142 86Q156 88 156 98L150 156L90 156Z" fill="#26262E"/>
<polyline points="100,110 120,126 140,110" fill="none" stroke-width="7" stroke-linejoin="miter" style="stroke:__V__"/>
<path d="M88 100Q62 128 52 168" stroke="#26262E" stroke-width="16" stroke-linecap="round" fill="none"/>
<path d="M152 100Q178 128 188 168" stroke="#26262E" stroke-width="16" stroke-linecap="round" fill="none"/>
<path d="M64.2 134.4L60 143.6" stroke-width="16" fill="none" style="stroke:__E__"/>
<path d="M175.8 134.4L180 143.6" stroke-width="16" fill="none" style="stroke:__D__"/>
<circle cx="51" cy="172" r="7.5" fill="#B87A52"/><circle cx="189" cy="172" r="7.5" fill="#B87A52"/>
<circle cx="47" cy="168" r="3" fill="none" stroke="#9A6240" stroke-width="1.4"/><circle cx="193" cy="168" r="3" fill="none" stroke="#9A6240" stroke-width="1.4"/>
<rect x="112" y="68" width="16" height="16" fill="#9A6240"/>
<path d="M102 82h36v9q-18 7-36 0z" fill="#1E1E25"/>
<g fill="#4A2C20"><circle cx="98" cy="46" r="12"/><circle cx="142" cy="46" r="12"/><circle cx="104" cy="32" r="12"/><circle cx="120" cy="26" r="13"/><circle cx="136" cy="32" r="12"/><circle cx="96" cy="60" r="9"/><circle cx="144" cy="60" r="9"/></g>
<ellipse cx="120" cy="52" rx="22" ry="25" fill="#B87A52"/>
<ellipse cx="97.5" cy="57" rx="3.5" ry="5" fill="#B87A52"/><ellipse cx="142.5" cy="57" rx="3.5" ry="5" fill="#B87A52"/>
<circle cx="97.5" cy="63" r="1.7" fill="#E8C46A"/><circle cx="142.5" cy="63" r="1.7" fill="#E8C46A"/>
<g fill="#4A2C20"><circle cx="108" cy="40" r="8"/><circle cx="120" cy="37" r="8"/><circle cx="132" cy="40" r="8"/><circle cx="100" cy="48" r="6"/><circle cx="140" cy="48" r="6"/></g>
<g fill="#6B4330"><circle cx="104" cy="35" r="2.4"/><circle cx="124" cy="31" r="2.4"/><circle cx="138" cy="38" r="2.2"/><circle cx="100" cy="44" r="2"/></g>
FACE
</g>`;
const CARDS=[
{id:'louco',num:'0',nome:'O Louco',poder:'Pulo duplo',desc:'Um pulo extra no ar.',cor:'#5FCFE0'},
{id:'mago',num:'I',nome:'O Mago',poder:'Ímã',desc:'Atrai Sonhos próximos.',cor:'#A78BDB'},
{id:'sacer',num:'II',nome:'A Sacerdotisa',poder:'Intuição',desc:'Evita duas quedas em buracos ou armadilhas.',cor:'#6CC38A'},
{id:'imper',num:'III',nome:'A Imperatriz',poder:'Vida extra',desc:'Acrescenta um nível de vida.',cor:'#F28FB1'},
{id:'carro',num:'VII',nome:'O Carro',poder:'Arrancada',desc:'Velocidade +25%.',cor:'#3FBFA8'},
{id:'forca',num:'VIII',nome:'A Força',poder:'Três vidas',desc:'Começa a sessão com 3 níveis de vida.',cor:'#F28C28'},
{id:'eremita',num:'IX',nome:'O Eremita',poder:'Flutuação',desc:'Segure no ar para planar.',cor:'#5B8DEF'},
{id:'roda',num:'X',nome:'A Roda da Fortuna',poder:'Sorte',desc:'Dobro de moedas douradas.',cor:'#B5D96B'},
{id:'morte',num:'XIII',nome:'A Morte',poder:'Renascimento',desc:'Volta uma vez depois de bater.',cor:'#D95FD0'},
{id:'torre',num:'XVI',nome:'A Torre',poder:'Relâmpago',desc:'Limpa os obstáculos 1 vez, quando você tocar no ⚡.',cor:'#E8604C'},
{id:'lua',num:'XVIII',nome:'A Lua',poder:'Noite eterna',desc:'Menos visão, pontos x1,5.',cor:'#E6E9F0'},
{id:'sol',num:'XIX',nome:'O Sol',poder:'Proteção solar',desc:'Reduz pela metade o dano de colisões.',cor:'#F3C74F'}];
const ROLES=['Principal · V do peito','Manga esquerda','Manga direita'];
const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('c'),ctx=cv.getContext('2d');
let state='menu',cards=[],P={},S={},U={},items=[],imgs={},pointers=new Set(),last=0,scale=1;

function fit(){
  scale=Math.min(innerWidth/W,innerHeight/H);const dpr=Math.min(devicePixelRatio||1,2);
  stage.style.transform='scale('+scale+')';stage.style.left=(innerWidth-W*scale)/2+'px';stage.style.top=(innerHeight-H*scale)/2+'px';
  cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
}
addEventListener('resize',fit);fit();

function drawCards(){
  const hour=new Date().getHours(),night=hour>=21||hour<6;
  const deck=CARDS.slice(),first=Math.random()<.9?CARDS.find(c=>c.id==='forca'):deck.filter(c=>c.id!=='forca')[Math.floor(Math.random()*11)];
  const picked=[first];
  while(picked.length<3){const pool=deck.filter(c=>!picked.includes(c)&&!(c.id==='lua'&&picked.some(x=>x.id==='sol'))&&!(c.id==='sol'&&picked.some(x=>x.id==='lua')));const w=pool.map(c=>c.id==='lua'&&night?1.4:1);let n=Math.random()*w.reduce((a,b)=>a+b,0),choice=pool[0];for(let i=0;i<pool.length;i++){n-=w[i];if(n<=0){choice=pool[i];break;}}picked.push(choice);}
  return picked;
}
function svgFor(aura,face,v,e,d){
  const body=SVG_BODY.replace('FACE',SVG_FACE[face]).replace(/__V__/g,v).replace(/__E__/g,e).replace(/__D__/g,d);
  return SVG_HEAD+SVG_AURA[aura]+body+'</svg>';
}
function loadImgs(){
  const aura=cards.some(c=>c.id==='forca')?'forca':'normal';
  const [a,b,c]=cards.map(x=>x.cor);const out={};
  const jobs=['feliz','triste'].map(face=>new Promise(res=>{const im=new Image();im.onload=()=>res();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgFor(aura,face,a,b,c));out[face]=im;}));
  imgs=out;return Promise.all(jobs);
}
function showDraw(){
  cards=drawCards();state='draw';
  $('menu').classList.add('off');$('end').classList.add('off');$('draw').classList.remove('off');$('go').classList.add('off');$('jb').style.display='none';$('tb').style.display='none';
  const box=$('cards');box.innerHTML='';
  cards.forEach((c,i)=>{
    const el=document.createElement('div');el.className='card';
    el.innerHTML='<div class="inner"><div class="face back">✦</div><div class="face front'+(c.id==='forca'?' hit':'')+'"><div class="bar" style="background:'+c.cor+'"></div><div class="role">'+ROLES[i]+'</div><div class="num">'+c.num+'</div><div class="nm">'+c.nome+'</div><div class="pw">'+c.poder+'</div><div class="ds">'+c.desc+'</div></div></div>';
    box.appendChild(el);setTimeout(()=>el.classList.add('flip'),900+i*1100);
  });
  loadImgs().then(()=>setTimeout(()=>$('go').classList.remove('off'),900+2*1100+700));
}
function startRun(){
  const has=id=>cards.some(c=>c.id===id);
  P={};CARDS.forEach(c=>P[c.id]=has(c.id));
  U={forca:0,louco:0,mago:0,sacer:0,imper:0,carro:0,eremita:0,roda:0,morte:0,torre:0,lua:0,sol:0};
  const peak=70,g=1800;
  S={dist:0,z:0,vz:0,g,v0:Math.sqrt(2*g*peak),air:0,float:0,score:0,coins:0,stars:0,flash:0,resolved:0,hits:0,lives:(P.forca?3:1)+(P.imper?1:0),invuln:0,face:0,
     shield:false,shieldT:0,slowE:2,sacerFalls:2,morteUsed:false,torreUsed:false,gold:0,bonus:0,ending:0,dead:false,t:0,speed:300*(P.carro?1.25:1)};
  const pat=['c','r','c','a','h','c','g','t','c','R','h','e','C','c','l','a','t','g','c','h'];
  const coinIdx=pat.map((p,i)=>p==='c'||p==='C'?i:-1).filter(i=>i>=0);
  for(let i=coinIdx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[coinIdx[i],coinIdx[j]]=[coinIdx[j],coinIdx[i]];}
  const golds=new Set(coinIdx.slice(0,P.roda?4:2));
  items=pat.map((p,i)=>{
    const it={wx:760+i*330,k:p,ox:0,oy:0,att:false,mag:false,taken:false,gone:false,seen:false,bob:Math.random()*6};
    if(p==='c'||p==='C'){it.coin=true;it.star=true;it.air=p==='C';it.gold=false;}
    else if(p==='r'){it.w=40;it.h=46;}else if(p==='R'){it.w=52;it.h=58;it.k='r';}
    else if(p==='l'){it.w=70;it.h=44;}
    else if(p==='a'){it.k='alligator';it.w=76;it.h=38;it.baseWx=it.wx;}
    else if(p==='g'){it.k='cattle';it.w=62;it.h=68;}
    else if(p==='t'){it.k='toucan';it.w=52;it.h=42;it.baseWx=it.wx;}
    else if(p==='h'){it.k='hole';it.w=82;it.h=20;}
    else{it.w=44;it.h=50;}
    return it;});
  Array.from({length:P.roda?8:5},(_,i)=>i).forEach(i=>items.push({wx:760+(i*3+1)*330+165,k:'s',coin:true,star:true,gold:false,air:true,ox:0,oy:0,att:false,mag:false,taken:false,gone:false,bob:0}));
  $('tb').style.display='none';
  $('menu').classList.add('off');$('draw').classList.add('off');$('end').classList.add('off');$('jb').style.display='flex';$('countdown').classList.remove('off');$('count').textContent='5';$('pauseBtn').style.display='none';$('powerBtn').style.display=P.torre?'block':'none';$('audioBtn').style.display='block';state='countdown';S.countdown=5;S.pauseUsed=false;last=performance.now();
}
function gy(x){return 190+SLOPE*x}
function jump(){
  if(state!=='play'||S.dead)return;tone(520,.05);vibrate(12);
  if(S.z<=0.01&&S.vz<=0){S.vz=S.v0;S.air=P.louco?1:0;S.float=0;if(P.forca)U.forca++;}
  else if(P.louco&&S.air>0){S.air--;S.vz=S.v0*0.92;U.louco++;}
}
stage.addEventListener('pointerdown',e=>{pointers.add(e.pointerId);if(state==='play')jump();});
['pointerup','pointercancel','pointerleave'].forEach(t=>stage.addEventListener(t,e=>pointers.delete(e.pointerId)));
addEventListener('keydown',e=>{if(e.code==='KeyT'){zap();}if(e.code==='Space'){pointers.add('k');if(state==='play')jump();e.preventDefault();}});
addEventListener('keyup',e=>{if(e.code==='Space')pointers.delete('k');});
function zap(){if(state!=='play'||!P.torre||S.torreUsed||S.dead)return;S.torreUsed=true;U.torre++;S.flash=0.35;items.forEach(it=>{if(!it.coin&&!it.gone&&PX+(it.wx-S.dist)<W+80)it.gone=true;});$('tb').style.display='none';$('powerBtn').style.display='none';}
$('tb').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();zap();});
$('go').onclick=startRun;
$('menu').addEventListener('pointerdown',e=>{if(state==='menu'){e.preventDefault();showDraw();}});
$('pauseBtn').onclick=()=>{if(state==='play'&&!S.pauseUsed){S.pauseUsed=true;state='paused';$('pause').classList.remove('off');$('pauseBtn').style.display='none';}};
$('resume').onclick=()=>{if(state==='paused'){$('pause').classList.add('off');state='play';last=performance.now();}};
let audioOn=true,audioCtx=null;function tone(f=440,d=.08){if(!audioOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.025,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}catch(e){}}
$('audioBtn').onclick=()=>{audioOn=!audioOn;$('audioBtn').textContent='Áudio: '+(audioOn?'ligado':'desligado');};function vibrate(ms=25){if(navigator.vibrate)navigator.vibrate(ms);}
$('powerBtn').onclick=()=>{zap();tone(660,.12);vibrate(35);};

function hitRect(cx,cy,r,x,y,w,h){const nx=Math.max(x-w/2,Math.min(cx,x+w/2)),ny=Math.max(y-h,Math.min(cy,y));return (cx-nx)**2+(cy-ny)**2<r*r;}
function takeHit(){
  if(S.invuln>0)return;S.hits++;S.face=1.5;tone(180,.16);vibrate(90);
  S.lives-=P.sol?0.5:1;if(P.sol)U.sol++;
  if(S.lives>0){S.invuln=1;return;}
  if(P.morte&&!S.morteUsed){S.morteUsed=true;U.morte++;S.lives=1;S.invuln=3;return;}
  S.dead=true;S.ending=0.9;
}
function update(rdt){
  const holding=pointers.size>0;let ts=1;
  if(P.sacer){ts=1;}
  const dt=rdt*ts;S.t+=dt;
  if(state!=='countdown'&&!S.dead&&!S.ending){S.dist+=S.speed*dt;}
  let g=S.g;if(P.eremita&&holding&&S.vz<0&&S.z>0&&S.float<1.5){g*=0.25;S.float+=rdt;U.eremita+=rdt;}
  if(state==='countdown'){S.countdown-=rdt;$('count').textContent=Math.max(1,Math.ceil(S.countdown));if(S.countdown<=0){state='play';$('countdown').classList.add('off');$('pauseBtn').style.display='block';}return;}
  if(S.z>0||S.vz>0){S.vz-=g*dt;S.z+=S.vz*dt;if(S.z<=0){S.z=0;S.vz=0;S.float=0;}}
  if(S.flash>0)S.flash-=rdt;if(S.invuln>0)S.invuln-=dt;if(S.face>0)S.face-=rdt;
  
  const pcx=PX,pcy=gy(PX)-67-S.z;
  for(const it of items){
    if(it.gone||it.taken)continue;
    if(!it.coin&&it.k==='e'&&!S.dead)it.wx-=70*dt;
    const sx=PX+(it.wx-S.dist);
    if(it.coin){
      let x=sx,y=gy(sx)-(it.star?115:(it.air?150:70));
      if(P.mago&&!it.att&&Math.hypot(sx-pcx,y-pcy)<150){it.att=true;it.mag=true;}
      if(it.att){const bx=sx+it.ox,by=y+it.oy,dx=pcx-bx,dy=pcy-by,d=Math.hypot(dx,dy)||1,st=Math.min(d,560*rdt);it.ox+=dx/d*st;it.oy+=dy/d*st;}
      x=sx+it.ox;y=y+it.oy;it.x=x;it.y=y;
      if(!S.dead&&Math.hypot(x-pcx,y-pcy)<26+13){
        it.taken=true;S.stars++;S.resolved++;S.score+=10*(P.lua?1.5:1);if(P.lua)S.bonus+=5;if(it.mag)U.mago++;
      }else if(sx<PX-70){it.gone=true;if(!it.star)S.resolved++;}
    }else{
      const y=gy(sx),bob=(it.k==='e'||it.k==='toucan')?Math.sin(S.t*4+it.bob)*10:0;it.x=sx;it.y=y;it.by=bob;
      if(it.k==='alligator')it.wx=it.baseWx+Math.sin(S.t*2.1+it.baseWx)*42;
      if(it.k==='toucan')it.wx=it.baseWx+Math.sin(S.t*2.8+it.baseWx)*22;
      if(it.k==='hole'){
        if(!S.dead&&sx>-38&&sx<38&&S.z<18&&S.t-(it.lastHit||-10)>1.1){if(P.sacer&&S.sacerFalls>0){S.sacerFalls--;it.gone=true;}else{takeHit();it.lastHit=S.t;S.dist=Math.max(0,S.dist-115);S.invuln=1;}}
      }else if(!S.dead&&sx>-80&&hitRect(pcx,pcy,26,sx,y-bob-(it.k==='toucan'?95:0),it.w,it.h)){takeHit();}
      if(sx<-80)it.gone=true;
    }
  }
  if(!S.dead&&S.resolved>=10&&!S.ending)S.ending=0.8;
  if(S.ending>0){S.ending-=rdt;if(S.ending<=0)finish();}
}
function usageText(c){
  switch(c.id){
  case'forca':return 'vida inicial: 3 níveis';
  case'louco':return U.louco+' pulos duplos';
  case'mago':return U.mago+(U.mago===1?' Sonho atraído':' Sonhos atraídos');
  case'sacer':return (2-S.sacerFalls)+' quedas evitadas';
  case'imper':return U.imper?'vida extra usada':'vida extra não foi necessária';
  case'carro':return 'velocidade +25% o tempo todo';
  case'eremita':return U.eremita.toFixed(1).replace('.',',')+' s planando';
  case'roda':return U.roda+(U.roda===1?' moeda dourada':' moedas douradas')+' (chance dobrada)';
  case'morte':return U.morte?'renasceu 1 vez':'não precisou renascer';
  case'torre':return U.torre?'relâmpago ativado: limpou os obstáculos':'relâmpago não foi ativado';
  case'lua':return '+'+Math.round(S.bonus)+' pontos de bônus';
  case'sol':return U.sol+' colisões com dano reduzido pela metade';}
}
function finish(){
  state='end';$('jb').style.display='none';$('tb').style.display='none';
  const won=!S.dead;
  $('end').innerHTML='<div class="box"><h2>'+(won?'Sessão concluída':'Meditação interrompida')+'</h2><div class="stats"><div class="stat"><b>'+Math.round(S.score)+'</b><span>pontos</span></div><div class="stat"><b>'+(S.stars*10)+'</b><span>Sonhos</span></div><div class="stat"><b>'+S.lives+'</b><span>vida restante</span></div><div class="stat"><b>'+S.hits+'</b><span>colisões</span></div></div><div style="font-size:13px;color:#CFC8E8">Poderes usados</div>'+
   cards.map((c,i)=>'<div class="pu"><span class="dot" style="background:'+c.cor+'"></span><div><b>'+c.nome+'</b> · '+c.poder+'<small>'+usageText(c)+'</small></div></div>').join('')+
   '<div style="display:flex;gap:10px;justify-content:center;margin-top:4px"><button id="again">Jogar de novo</button></div></div>';
  $('end').classList.remove('off');$('pauseBtn').style.display='none';$('powerBtn').style.display='none';$('audioBtn').style.display='none';$('again').onclick=showDraw;
  const share=document.createElement('button');share.className='alt';share.textContent='Compartilhar resultado';share.onclick=()=>{const text='Path of Sanira · '+Math.round(S.score)+' pontos · '+(S.stars*10)+' Sonhos';if(navigator.share)navigator.share({title:'Path of Sanira',text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text);};$('end').querySelector('.box').appendChild(share);
}

function mount(off,col,base,amp,seed){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W+20;x+=20){const wx=x+off;const y=base-amp*(0.55+0.45*Math.sin(wx/130+seed))-amp*0.35*Math.abs(Math.sin(wx/61+seed*2));ctx.lineTo(x,y);}
  ctx.lineTo(W+20,H);ctx.closePath();ctx.fill();
}
function drawBg(){
  ctx.fillStyle='#A9D8EE';ctx.fillRect(0,0,W,H);ctx.fillStyle='#C8E7F1';ctx.fillRect(0,110,W,140);ctx.fillStyle='#DDF0F2';ctx.fillRect(0,190,W,120);
  ctx.fillStyle='#FFF6D6';ctx.beginPath();ctx.arc(470,62,40,0,7);ctx.fill();ctx.fillStyle='#FFE9A8';ctx.beginPath();ctx.arc(470,62,25,0,7);ctx.fill();
  mount(S.dist*0.05||0,'#C4D0EA',185,80,1);mount(S.dist*0.12||0,'#A9B9DD',235,70,3);
  const d=S.dist||0;
  ctx.fillStyle='#86B890';ctx.beginPath();ctx.moveTo(0,gy(0));ctx.lineTo(W,gy(W));ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#B9DDB0';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,gy(0));ctx.lineTo(W,gy(W));ctx.stroke();
  ctx.fillStyle='#6FA283';ctx.beginPath();ctx.moveTo(0,gy(0)+40);ctx.lineTo(W,gy(W)+40);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  ctx.fillStyle='#7BAE8A';for(let i=0;i<14;i++){const x=((i*80-d*0.9)%(W+80)+W+80)%(W+80)-40;const y=gy(x)+18+(i%3)*9;ctx.fillRect(x,y,22,3);}
}
function drawRock(x,y,w,h){ctx.fillStyle='#3F5A4C';ctx.globalAlpha=.25;ctx.beginPath();ctx.ellipse(x,y+2,w*.7,4,0,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle='#8E93A8';ctx.beginPath();ctx.moveTo(x-w/2,y);ctx.lineTo(x-w*.3,y-h*.65);ctx.lineTo(x,y-h);ctx.lineTo(x+w*.3,y-h*.8);ctx.lineTo(x+w/2,y);ctx.closePath();ctx.fill();
  ctx.fillStyle='#AAB0C4';ctx.beginPath();ctx.moveTo(x-w*.3,y-h*.65);ctx.lineTo(x,y-h);ctx.lineTo(x+w*.1,y-h*.5);ctx.lineTo(x-w*.2,y-h*.3);ctx.closePath();ctx.fill();}
function drawLog(x,y,w,h){ctx.fillStyle='#3F5A4C';ctx.globalAlpha=.25;ctx.beginPath();ctx.ellipse(x,y+2,w*.6,4,0,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle='#8B6B4E';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-10,y-14);ctx.lineTo(x-20,y-h);ctx.moveTo(x+4,y-14);ctx.lineTo(x+12,y-h+6);ctx.stroke();
  ctx.fillStyle='#8B6B4E';ctx.beginPath();ctx.roundRect(x-w/2,y-18,w,18,9);ctx.fill();ctx.fillStyle='#A68465';ctx.fillRect(x-w/2+8,y-18,w-16,5);ctx.fillStyle='#D2AE86';ctx.beginPath();ctx.ellipse(x+w/2-3,y-9,4.5,8,0,0,7);ctx.fill();}
function drawEnemy(x,y,w,h){ctx.fillStyle='#3F5A4C';ctx.globalAlpha=.2;ctx.beginPath();ctx.ellipse(x,y+2,w*.6,4,0,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle='#5A4B8A';ctx.beginPath();ctx.ellipse(x,y-h*.45,w*.5,h*.45,0,0,7);ctx.fill();
  ctx.beginPath();for(let i=0;i<5;i++){const a=Math.PI+i*Math.PI/4;ctx.moveTo(x+Math.cos(a)*w*.42,y-h*.45+Math.sin(a)*h*.4);ctx.lineTo(x+Math.cos(a)*w*.68,y-h*.45+Math.sin(a)*h*.66);ctx.lineTo(x+Math.cos(a+.3)*w*.42,y-h*.45+Math.sin(a+.3)*h*.4);}ctx.fill();
  ctx.fillStyle='#F5EFE0';ctx.beginPath();ctx.arc(x-8,y-h*.5,5,0,7);ctx.arc(x+8,y-h*.5,5,0,7);ctx.fill();ctx.fillStyle='#14122B';ctx.beginPath();ctx.arc(x-9,y-h*.5,2.2,0,7);ctx.arc(x+7,y-h*.5,2.2,0,7);ctx.fill();}
function drawAlligator(x,y,w,h){ctx.fillStyle='#477B54';ctx.beginPath();ctx.ellipse(x,y-h*.45,w*.42,h*.42,0,0,Math.PI*2);ctx.fill();ctx.fillRect(x-w*.5,y-h*.35,w*.35,h*.2);ctx.fillStyle='#E8C46A';ctx.fillRect(x+w*.15,y-h*.8,5,5);ctx.fillRect(x+w*.32,y-h*.8,5,5);ctx.strokeStyle='#244A38';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-w*.35,y-h*.15);ctx.lineTo(x-w*.5,y);ctx.moveTo(x+w*.2,y-h*.15);ctx.lineTo(x+w*.35,y);ctx.stroke();}
function drawCattle(x,y,w,h){ctx.fillStyle='#F0E9D8';ctx.beginPath();ctx.ellipse(x,y-h*.42,w*.38,h*.4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4C3D36';ctx.beginPath();ctx.ellipse(x-9,y-h*.5,9,12,0,0,Math.PI*2);ctx.ellipse(x+10,y-h*.3,8,10,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#E8C46A';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-12,y-h*.75);ctx.lineTo(x-22,y-h*.95);ctx.moveTo(x+12,y-h*.75);ctx.lineTo(x+22,y-h*.95);ctx.stroke();}
function drawToucan(x,y,w,h){ctx.fillStyle='#20252B';ctx.beginPath();ctx.ellipse(x,y-h*.45,w*.32,h*.45,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#F3C74F';ctx.beginPath();ctx.moveTo(x+8,y-h*.65);ctx.quadraticCurveTo(x+w*.8,y-h*.55,x+10,y-h*.4);ctx.fill();ctx.fillStyle='#F5EFE0';ctx.beginPath();ctx.arc(x-3,y-h*.65,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#14122B';ctx.fillRect(x-4,y-h*.67,2,2);ctx.strokeStyle='#20252B';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-8,y-h*.15);ctx.lineTo(x-18,y);ctx.moveTo(x+5,y-h*.15);ctx.lineTo(x+13,y);ctx.stroke();}
function drawCoin(x,y,gold){
  ctx.fillStyle=gold?'rgba(255,200,60,.45)':'rgba(255,233,168,.6)';ctx.beginPath();ctx.arc(x,y,gold?24:20,0,7);ctx.fill();
  ctx.fillStyle=gold?'#FFB300':'#F3C74F';ctx.beginPath();ctx.arc(x,y,14,0,7);ctx.fill();
  ctx.strokeStyle=gold?'#D98200':'#E0A92E';ctx.lineWidth=3;ctx.stroke();ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,8,0,7);ctx.stroke();
  ctx.strokeStyle='#FFF3C4';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,10,3.6,4.6);ctx.stroke();}
function drawStar(x,y){ctx.fillStyle='rgba(255,75,92,.22)';ctx.beginPath();ctx.arc(x,y,20,0,7);ctx.fill();ctx.fillStyle='#E84B5B';ctx.strokeStyle='#A9233B';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?7:15;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.stroke();}
function pill(x,y,t,col){ctx.font='12px system-ui,sans-serif';const w=ctx.measureText(t).width+28;ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.roundRect(x,y,w,22,11);ctx.fill();ctx.fillStyle=col;ctx.beginPath();ctx.arc(x+12,y+11,5,0,7);ctx.fill();ctx.fillStyle='#3E3552';ctx.textBaseline='middle';ctx.fillText(t,x+22,y+12);return w;}
function render(){
  drawBg();
  for(const it of items){
    if(it.gone||it.taken)continue;
    if(it.coin){if(it.x===undefined)continue;(it.star?drawStar(it.x,it.y):drawCoin(it.x,it.y,it.gold));continue;}
    const sx=PX+(it.wx-S.dist),y=gy(sx);if(sx>W+80||sx<-80)continue;
    if(it.k==='r')drawRock(sx,y,it.w,it.h);else if(it.k==='l')drawLog(sx,y,it.w,it.h);else if(it.k==='hole'){ctx.fillStyle='#26352F';ctx.beginPath();ctx.ellipse(sx,y+2,it.w/2,12,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#B9DDB0';ctx.lineWidth=3;ctx.stroke();}else if(it.k==='alligator')drawAlligator(sx,y,it.w,it.h);else if(it.k==='cattle')drawCattle(sx,y,it.w,it.h);else if(it.k==='toucan')drawToucan(sx,y-95,it.w,it.h);else drawEnemy(sx,y-(Math.sin(S.t*4+it.bob)*10),it.w,it.h);
  }
  const gyP=gy(PX),s=S0;
  ctx.fillStyle='rgba(62,53,82,.2)';ctx.beginPath();ctx.ellipse(PX,gyP+4,40/(1+S.z/150),6/(1+S.z/150),0,0,7);ctx.fill();
  const img=imgs[S.face>0?'triste':'feliz'];
  if(img){
    ctx.save();
    if(S.invuln>0&&Math.floor(S.t*14)%2)ctx.globalAlpha=.45;
    ctx.translate(PX,gyP-20-S.z-86*s);ctx.rotate(Math.atan(SLOPE)*0.6);
    ctx.drawImage(img,-120*s,-116*s,240*s,240*s);ctx.restore();
  }
  if(P.sol&&S.shield){ctx.strokeStyle='#F3C74F';ctx.lineWidth=3;ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(PX,gyP-67-S.z,48,0,7);ctx.stroke();ctx.globalAlpha=1;}
  if(P.lua){const px=PX,py=gyP-67-S.z;const gr=ctx.createRadialGradient(px,py,110,px,py,330);gr.addColorStop(0,'rgba(20,18,43,0)');gr.addColorStop(1,'rgba(20,18,43,.82)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);}
  if(S.flash>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(.85,S.flash*3)+')';ctx.fillRect(0,0,W,H);}
  ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.roundRect(718,14,112,60,16);ctx.fill();
  ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillStyle='#6C5B9E';ctx.font='700 11px system-ui,sans-serif';ctx.fillText('PONTOS',774,32);
  ctx.fillStyle='#3E3552';ctx.font='700 30px system-ui,sans-serif';ctx.fillText(String(Math.round(S.score)),774,63);ctx.textAlign='left';
  let x=14;cards.forEach(c=>{x+=pill(x,14,c.poder,c.cor)+6;});
  ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.roundRect(14,44,112,22,11);ctx.fill();ctx.fillStyle='#3E3552';ctx.font='700 12px system-ui,sans-serif';ctx.textBaseline='middle';ctx.fillText('Sonhos '+S.stars*10,24,56);
  ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.roundRect(14,72,112,22,11);ctx.fill();ctx.fillStyle='#3E3552';ctx.fillText('Vida '+Math.max(0,S.lives),24,84);
}
function loop(now){
  const rdt=Math.min(.033,(now-last)/1000);last=now;
  if(state==='play'||state==='countdown'){update(rdt);render();}
  if(state==='paused'){render();}
  requestAnimationFrame(loop);
}
S={dist:0,z:0,t:0,score:0,coins:0,face:0,invuln:0,slowE:2};
requestAnimationFrame(loop);
</script>
