function fit(){
  scale=Math.min(innerWidth/W,innerHeight/H);const dpr=Math.min(devicePixelRatio||1,2);
  stage.style.transform='scale('+scale+')';stage.style.left=(innerWidth-W*scale)/2+'px';stage.style.top=(innerHeight-H*scale)/2+'px';
  cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
}
addEventListener('resize',fit);fit();

function drawCards(){
  const hour=new Date().getHours(),night=hour>=21||hour<6;
  const deck=CARDS.slice(),first=Math.random()<.9?CARDS.find(c=>c.id==='forca'):deck.filter(c=>c.id!=='forca')[Math.floor(Math.random()*11)];
  const picked=[first];
  while(picked.length<3){const pool=deck.filter(c=>!picked.includes(c));const w=pool.map(c=>c.id==='lua'&&night?1.4:1);let n=Math.random()*w.reduce((a,b)=>a+b,0),choice=pool[0];for(let i=0;i<pool.length;i++){n-=w[i];if(n<=0){choice=pool[i];break;}}picked.push(choice);}
  return picked;
}
function svgFor(aura,face,v,e,d){
  const body=SVG_BODY.replace('FACE',SVG_FACE[face]).replace(/__V__/g,v).replace(/__E__/g,e).replace(/__D__/g,d);
  return SVG_HEAD+SVG_AURA[aura]+body+'</svg>';
}
function loadImgs(){
  const aura=cards.some(c=>c.id==='forca')?'forca':'normal';
  const [a,b,c]=cards.map(x=>x.cor);const out={};
  const jobs=['feliz','triste'].map(face=>new Promise(res=>{const im=new Image();im.onload=()=>res();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgFor(aura,face,a,b,c));out[face]=im;}));
  imgs=out;return Promise.all(jobs);
}
function showDraw(mode='random'){
  if(mode==='random')cards=drawCards();
  else cards=[...document.querySelectorAll('.custom-power:checked')].map(input=>CARDS.find(c=>c.id===input.value));
  state='draw';
  $('menu').classList.add('off');$('end').classList.add('off');$('draw').classList.remove('off');$('go').classList.add('off');$('tb').style.display='none';$('homeControls').style.display='none';
  const box=$('cards');box.innerHTML='';
  cards.forEach((c,i)=>{
    const el=document.createElement('div');el.className='card';
    el.innerHTML='<div class="inner"><div class="face back">✦</div><div class="face front'+(c.id==='forca'?' hit':'')+'" style="border-color:'+c.cor+'88"><div class="tarot-top" style="color:'+c.cor+'">'+c.num+'</div><div class="tarot-frame" style="color:'+c.cor+';border-color:'+c.cor+'88">'+TAROT_ART[c.id]+'</div><div class="tarot-name" style="color:'+c.cor+'">'+c.nome+'</div><div class="tarot-pw" style="color:'+c.cor+'">'+c.poder+'</div></div></div>';
    box.appendChild(el);setTimeout(()=>el.classList.add('flip'),900+i*1100);
  });
  loadImgs().then(()=>setTimeout(()=>$('go').classList.remove('off'),900+2*1100+700));
}
const OBSTACLE_TYPES=[{k:'r',w:40,h:46,weight:20},{k:'l',w:70,h:44,weight:15},{k:'alligator',w:76,h:38,weight:15},{k:'cattle',w:62,h:68,weight:15},{k:'toucan',w:52,h:42,weight:15},{k:'e',w:44,h:50,weight:8}];
function makeDream(wx){return{wx,k:'s',coin:true,star:true,gold:false,air:Math.random()<.65,ox:0,oy:0,att:false,mag:false,taken:false,gone:false,bob:Math.random()*6};}
function makeObstacle(wx){const pool=OBSTACLE_TYPES.filter(o=>o.k!==S.previousObstacle);let n=Math.random()*pool.reduce((a,o)=>a+o.weight,0),o=pool[0];for(const q of pool){n-=q.weight;if(n<=0){o=q;break;}}S.previousObstacle=o.k;const key=o.k==='alligator'?'alligator':o.k==='cattle'?'cattle':o.k==='toucan'?'toucan':'enemy';const it={wx,k:o.k,w:o.w,h:o.h,theme:THEMES[key][S.level-1],ox:0,oy:0,att:false,mag:false,taken:false,gone:false,bob:Math.random()*6};if(o.k==='alligator'||o.k==='toucan')it.baseWx=wx;return it;}
function spawnAhead(){if(S.transitionPhase||S.dead)return;const end=S.dist+W+760;while(S.nextObstacleWx<end){items.push(makeObstacle(S.nextObstacleWx));const f=(S.level===4?1.1:S.level===5?1.2:1)*(S.level===5&&S.level5Boost?1.1:1);S.nextObstacleWx+=(270+Math.random()*150)/f;}while(S.nextDreamWx<end){items.push(makeDream(S.nextDreamWx));S.nextDreamWx+=((930+Math.random()*240)/((P.roda?1.35:1)*(S.level===5&&S.level5Boost?1.2:1)));}}
function applyLevelSpeed(){S.speed=300*(1+(S.level===4?.15:S.level===5?.30:0)+(P.carro?.40:0))*(S.level5Boost?1.1:1);}
function beginLevelTransition(){if(S.transitionPhase||S.level>=5)return;S.transitionPhase='pre';S.transitionTimer=3;S.worldFrom=S.level;S.transitionProgress=0;items.length=0;groundSlope=0;S.nextObstacleWx=Infinity;S.nextDreamWx=Infinity;}
function advanceTransition(dt){if(!S.transitionPhase)return;S.transitionTimer-=dt;if(S.transitionPhase==='dissolve')S.transitionProgress=Math.min(1,1-S.transitionTimer/2);if(S.transitionTimer>0)return;if(S.transitionPhase==='pre'){S.level=Math.min(5,S.level+1);applyLevelSpeed();changeMeditationTrack(S.level-1);S.transitionPhase='dissolve';S.transitionTimer=2;S.transitionProgress=0;}else if(S.transitionPhase==='dissolve'){S.transitionPhase='post';S.transitionTimer=4;S.transitionProgress=1;}else{S.transitionPhase=null;S.transitionTimer=0;S.levelElapsed=0;groundSlope=SLOPE;S.nextObstacleWx=S.dist+760;S.nextDreamWx=S.dist+1050;S.previousObstacle='';}}

 const has=id=>cards.some(c=>c.id===id);P={};CARDS.forEach(c=>P[c.id]=has(c.id));
 U={forca:0,louco:0,mago:0,sacer:0,imper:0,carro:0,eremita:0,roda:0,morte:0,torre:0,lua:0,sol:0};
 const peak=70,g=1800;S={dist:0,z:0,vz:0,g,v0:Math.sqrt(2*g*peak),air:0,float:0,spin:0,score:0,coins:0,stars:0,flash:0,resolved:0,hits:0,lives:(P.forca?3:1)+(P.imper?1:0),invuln:0,face:0,shield:false,shieldT:0,slowE:2,sacerFalls:2,sacerCooldown:0,sacerAura:0,morteUsed:false,morteGray:false,torreUsed:false,gold:0,bonus:0,ending:0,dead:false,t:0,hudVisible:false,speed:300*(P.carro?1.4:1),level:1,levelElapsed:0,transitionPhase:null,transitionTimer:0,transitionProgress:0,worldFrom:1,nextObstacleWx:760,nextDreamWx:1120,previousObstacle:'',elapsed:0,level5Boost:false};
 items=[];groundSlope=0;currentRankId=null;$('tb').style.display='none';if(audioOn)startMeditationAudio(0);$('homeControls').style.display='none';$('menu').classList.add('off');$('draw').classList.add('off');$('end').classList.add('off');PX=W/2;$('powerBtn').style.display='none';state='intro';S.intro=3;last=performance.now();
}
function gy(x){return 190+groundSlope*x}
function jump(){
  if(state!=='play'||S.dead)return;S.hudVisible=true;tone(520,.05);vibrate(12);
  if(S.z<=0.01&&S.vz<=0){S.vz=S.v0;S.air=P.louco?1:0;S.float=0;if(P.forca)U.forca++;}
  else if(P.louco&&S.air>0){S.air--;S.vz=S.v0*1.5;S.spin=0.34;U.louco++;}
}
stage.addEventListener('pointerdown',e=>{pointers.add(e.pointerId);if(state==='play')jump();});
['pointerup','pointercancel','pointerleave'].forEach(t=>stage.addEventListener(t,e=>pointers.delete(e.pointerId)));

function zap(){if((state!=='play'&&state!=='intro')||!P.torre||S.torreUsed||S.dead)return;S.hudVisible=true;S.torreUsed=true;U.torre++;S.flash=0.35;items.forEach(it=>{if(!it.coin&&!it.gone&&PX+(it.wx-S.dist)<W+80)it.gone=true;});$('tb').style.display='none';$('powerBtn').style.display='none';}
$('tb').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();zap();});

function createMusicTrack(index){
 const c=MUSIC_TRACKS[index],master=audioCtx.createGain(),voices=[];master.gain.value=0;master.connect(audioCtx.destination);
 c.voices.forEach(([freq,vol],i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),l=audioCtx.createOscillator(),lg=audioCtx.createGain();o.type=c.wave;o.frequency.value=freq;g.gain.value=vol;l.type='sine';l.frequency.value=c.rate+i*.006;lg.gain.value=vol*c.depth;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(master);o.start();l.start();voices.push(o,l);});
 return{master,voices,index};
}

function changeMeditationTrack(index){if(!audioOn)return;if(!audioCtx||!ambientNodes){startMeditationAudio(index);return;}const old=ambientNodes,t=createMusicTrack(index),n=audioCtx.currentTime,d=3;t.master.gain.setValueAtTime(0,n);t.master.gain.linearRampToValueAtTime(MUSIC_TRACKS[index].master,n+d);old.master.gain.cancelScheduledValues(n);old.master.gain.setValueAtTime(old.master.gain.value,n);old.master.gain.linearRampToValueAtTime(0,n+d);old.voices.forEach(o=>{try{o.stop(n+d+.08)}catch(e){}});ambientNodes=t;}

function tone(f=440,d=.08){

}

 let g=S.g;if(P.eremita&&holding&&S.vz<0&&S.z>0&&S.float<1.5){g*=.25;S.float+=rdt;U.eremita+=rdt;}
 if(S.z>0||S.vz>0){S.vz-=g*dt;S.z+=S.vz*dt;if(S.z<=0){S.z=0;S.vz=0;S.float=0;}}

  if(it.coin){let x=sx,y=gy(sx)-(it.star?115:(it.air?150:70));if(P.mago&&!it.att&&Math.hypot(sx-pcx,y-pcy)<150){it.att=true;it.mag=true;}if(it.att){const bx=sx+it.ox,by=y+it.oy,dx=pcx-bx,dy=pcy-by,d=Math.hypot(dx,dy)||1,st=Math.min(d,560*rdt);it.ox+=dx/d*st;it.oy+=dy/d*st;}x=sx+it.ox;y=y+it.oy;it.x=x;it.y=y;if(!S.dead&&S.sacerCooldown<=0&&Math.hypot(x-pcx,y-pcy)<39){S.hudVisible=true;it.taken=true;S.stars++;S.resolved++;const v=10*(P.roda?1.5:1)*(P.lua?1.5:1);S.score+=v;if(P.lua)S.bonus+=10*(P.roda?1.5:1)*.5;if(it.mag)U.mago++;}else if(sx<PX-70)it.gone=true;
  }else{const y=gy(sx),bob=(it.k==='e'||it.k==='toucan')?Math.sin(S.t*4+it.bob)*10:0;it.x=sx;it.y=y;it.by=bob;if(it.k==='alligator')it.wx=it.baseWx+Math.sin(S.t*2.1+it.baseWx)*42;if(it.k==='toucan')it.wx=it.baseWx+Math.sin(S.t*2.8+it.baseWx)*22;if(!S.dead&&!S.transitionPhase&&sx>-80&&hitRect(pcx,pcy,26,sx,y-bob-(it.k==='toucan'?115:0),it.w,it.h)){const enemy=['alligator','cattle','toucan','enemy','e'].includes(it.k);if(P.sacer&&S.sacerCooldown<=0){S.sacerCooldown=15;S.sacerAura=1.5;U.sacer++;it.gone=true;}else takeHit(enemy?'enemy':'obstacle');}if(sx<-80)it.gone=true;}
 }

function formatTime(ms,withMillis=false){
 const total=Math.max(0,ms),minutes=Math.floor(total/60000),seconds=Math.floor(total/1000)%60,millis=total%1000;
 return String(minutes).padStart(2,'0')+':'+String(seconds).padStart(2,'0')+(withMillis?'.'+String(millis).padStart(3,'0'):'');
}
async function apiRequest(url,options={}){
 const response=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(data.error||'Não foi possível comunicar com o servidor.');
 return data;
}
async function handleGoogleCredential(response){

 if(level===2){ctx.fillStyle='#F2D99B';ctx.beginPath();ctx.arc(690,60,28,0,7);ctx.fill();for(let i=0;i<13;i++){const x=((i*86-d*.16)%(W+100)+W+100)%(W+100)-50,hh=65+(i%4)*23;ctx.fillStyle=i%2?'#3E704F':'#527F59';ctx.beginPath();ctx.moveTo(x-35,180);ctx.lineTo(x,180-hh);ctx.lineTo(x+35,180);ctx.fill();}for(let i=0;i<8;i++){const x=((i*125-d*.32)%(W+140)+W+140)%(W+140)-70;ctx.fillStyle='#315C42';ctx.fillRect(x-7,90,14,145);ctx.fillStyle='#477B54';ctx.beginPath();ctx.arc(x,94,34,0,7);ctx.arc(x-20,118,27,0,7);ctx.arc(x+21,120,28,0,7);ctx.fill();}}
 if(level===3){ctx.fillStyle='#E7D8B5';ctx.beginPath();ctx.arc(690,65,26,0,7);ctx.fill();for(let i=0;i<10;i++){const x=((i*105-d*.18)%(W+120)+W+120)%(W+120)-60,hh=65+(i%4)*22;ctx.fillStyle=i%2?'#697783':'#818B91';ctx.fillRect(x,190-hh,55,hh);ctx.fillStyle='#596674';ctx.fillRect(x+8,156-hh,12,34);ctx.fillStyle='#A6B0B5';ctx.fillRect(x+16,190-hh+15,8,7);ctx.fillRect(x+34,190-hh+15,8,7);}}
 if(level===4){ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.arc(680,58,25,0,7);ctx.fill();for(let i=0;i<6;i++){const x=i*175-40;ctx.fillStyle=i%2?'#A9C9DC':'#C5DDE8';ctx.beginPath();ctx.moveTo(x-90,205);ctx.lineTo(x+25,72+(i%3)*24);ctx.lineTo(x+135,205);ctx.closePath();ctx.fill();ctx.fillStyle='#F8FCFD';ctx.beginPath();ctx.moveTo(x+25,72+(i%3)*24);ctx.lineTo(x+3,112+(i%3)*24);ctx.lineTo(x+48,112+(i%3)*24);ctx.closePath();ctx.fill();}}
 if(level===5){for(let i=0;i<90;i++){const x=((i*97-d*.08)%(W+20)+W+20)%(W+20),y=(i*53)%215;ctx.fillStyle=i%4===0?'#F3D98B':'#E8E5FF';ctx.globalAlpha=.45+(i%5)*.1;ctx.beginPath();ctx.arc(x,y,i%7===0?2:1,0,7);ctx.fill();}ctx.globalAlpha=1;ctx.fillStyle='#62559A';ctx.beginPath();ctx.arc(650,95,47,0,7);ctx.fill();ctx.fillStyle='#A88FCB';ctx.beginPath();ctx.arc(635,80,17,0,7);ctx.fill();ctx.strokeStyle='#8C83C9';ctx.lineWidth=7;ctx.globalAlpha=.55;ctx.beginPath();ctx.ellipse(650,95,72,19,-.25,0,7);ctx.stroke();ctx.globalAlpha=1;}
 ctx.fillStyle=p.ground;ctx.beginPath();ctx.moveTo(0,gy(0));ctx.lineTo(W,gy(W));ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();ctx.strokeStyle=p.edge;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,gy(0));ctx.lineTo(W,gy(W));ctx.stroke();ctx.fillStyle=p.lower;ctx.beginPath();ctx.moveTo(0,gy(0)+40);ctx.lineTo(W,gy(W)+40);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();ctx.fillStyle=p.detail;for(let i=0;i<14;i++){const x=((i*80-d*.9)%(W+80)+W+80)%(W+80)-40;ctx.fillRect(x,gy(x)+18+(i%3)*9,22,3);}
}
function drawBg(){if(S.transitionPhase==='dissolve'){ctx.save();ctx.globalAlpha=1;drawWorld(S.worldFrom);ctx.restore();ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,S.transitionProgress));drawWorld(S.level);ctx.restore();}else drawWorld(S.level||1);}
function drawRock(x,y,w,h){ctx.fillStyle='#3F5A4C';ctx.globalAlpha=.25;ctx.beginPath();ctx.ellipse(x,y+2,w*.7,4,0,0,7);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#8E93A8';ctx.beginPath();ctx.moveTo(x-w/2,y);ctx.lineTo(x-w*.3,y-h*.65);ctx.lineTo(x,y-h);ctx.lineTo(x+w*.3,y-h*.8);ctx.lineTo(x+w/2,y);ctx.closePath();ctx.fill();ctx.fillStyle='#AAB0C4';ctx.beginPath();ctx.moveTo(x-w*.3,y-h*.65);ctx.lineTo(x,y-h);ctx.lineTo(x+w*.1,y-h*.5);ctx.lineTo(x-w*.2,y-h*.3);ctx.closePath();ctx.fill();}
function drawLog(x,y,w,h){ctx.fillStyle='#3F5A4C';ctx.globalAlpha=.25;ctx.beginPath();ctx.ellipse(x,y+2,w*.6,4,0,0,7);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#8B6B4E';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-10,y-14);ctx.lineTo(x-20,y-h);ctx.moveTo(x+4,y-14);ctx.lineTo(x+12,y-h+6);ctx.stroke();ctx.fillStyle='#8B6B4E';ctx.beginPath();ctx.roundRect(x-w/2,y-18,w,18,9);ctx.fill();ctx.fillStyle='#A68465';ctx.fillRect(x-w/2+8,y-18,w-16,5);ctx.fillStyle='#D2AE86';ctx.beginPath();ctx.ellipse(x+w/2-3,y-9,4.5,8,0,0,7);ctx.fill();}
function drawIceberg(x,y,w,h){ctx.fillStyle='rgba(50,91,120,.2)';ctx.beginPath();ctx.ellipse(x,y+2,w*.7,4,0,0,7);ctx.fill();ctx.fillStyle='#79BBD8';ctx.beginPath();ctx.moveTo(x-w/2,y);ctx.lineTo(x-w*.36,y-h*.48);ctx.lineTo(x-w*.12,y-h*.72);ctx.lineTo(x+w*.02,y-h);ctx.lineTo(x+w*.25,y-h*.62);ctx.lineTo(x+w*.42,y-h*.78);ctx.lineTo(x+w/2,y);ctx.closePath();ctx.fill();ctx.fillStyle='#EAF9FF';ctx.beginPath();ctx.moveTo(x-w*.36,y-h*.48);ctx.lineTo(x-w*.12,y-h*.72);ctx.lineTo(x+w*.02,y-h);ctx.lineTo(x+w*.12,y-h*.52);ctx.lineTo(x-w*.08,y-h*.39);ctx.closePath();ctx.fill();}
function drawFrozenLog(x,y,w,h){ctx.fillStyle='rgba(50,91,120,.2)';ctx.beginPath();ctx.ellipse(x,y+2,w*.6,4,0,0,7);ctx.fill();ctx.strokeStyle='#B8E8F6';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-10,y-14);ctx.lineTo(x-20,y-h);ctx.moveTo(x+4,y-14);ctx.lineTo(x+12,y-h+6);ctx.stroke();ctx.fillStyle='#729BB1';ctx.beginPath();ctx.roundRect(x-w/2,y-18,w,18,9);ctx.fill();ctx.fillStyle='#D9F5FC';ctx.fillRect(x-w/2+8,y-18,w-16,5);ctx.fillStyle='#A9D7E8';ctx.beginPath();ctx.ellipse(x+w/2-3,y-9,4.5,8,0,0,7);ctx.fill();}
function drawAsteroid(x,y,w,h){ctx.fillStyle='rgba(18,20,48,.35)';ctx.beginPath();ctx.ellipse(x,y+2,w*.7,4,0,0,7);ctx.fill();ctx.fillStyle='#70658D';ctx.beginPath();ctx.moveTo(x-w/2,y-h*.12);ctx.lineTo(x-w*.34,y-h*.72);ctx.lineTo(x-w*.02,y-h);ctx.lineTo(x+w*.31,y-h*.82);ctx.lineTo(x+w/2,y-h*.25);ctx.lineTo(x+w*.24,y);ctx.lineTo(x-w*.28,y);ctx.closePath();ctx.fill();ctx.fillStyle='#A99AC7';ctx.beginPath();ctx.moveTo(x-w*.34,y-h*.72);ctx.lineTo(x-w*.02,y-h);ctx.lineTo(x+w*.12,y-h*.54);ctx.lineTo(x-w*.08,y-h*.36);ctx.closePath();ctx.fill();ctx.fillStyle='#40395F';ctx.beginPath();ctx.arc(x-w*.2,y-h*.45,Math.max(2,w*.08),0,7);ctx.arc(x+w*.22,y-h*.28,Math.max(2,w*.06),0,7);ctx.fill();}
function drawComet(x,y,w,h){ctx.fillStyle='rgba(18,20,48,.35)';ctx.beginPath();ctx.ellipse(x,y+2,w*.65,4,0,0,7);ctx.fill();ctx.fillStyle='#D98B67';ctx.beginPath();ctx.moveTo(x-w*.5,y-h*.55);ctx.lineTo(x-w*.16,y-h*.35);ctx.lineTo(x+w*.12,y-h*.78);ctx.lineTo(x+w*.5,y-h*.42);ctx.lineTo(x+w*.43,y-h*.1);ctx.lineTo(x+w*.08,y);ctx.lineTo(x-w*.3,y-h*.08);ctx.closePath();ctx.fill();ctx.strokeStyle='#F4C58A';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-w*.35,y-h*.5);ctx.lineTo(x-w*.05,y-h*.4);ctx.lineTo(x+w*.1,y-h*.72);ctx.stroke();ctx.fillStyle='#F4D4A4';ctx.beginPath();ctx.arc(x+w*.22,y-h*.38,Math.max(3,h*.13),0,7);ctx.fill();}
function drawCoin(x,y,gold){
  ctx.fillStyle=gold?'rgba(255,200,60,.45)':'rgba(255,233,168,.6)';ctx.beginPath();ctx.arc(x,y,gold?24:20,0,7);ctx.fill();
  ctx.fillStyle=gold?'#FFB300':'#F3C74F';ctx.beginPath();ctx.arc(x,y,14,0,7);ctx.fill();
  ctx.strokeStyle=gold?'#D98200':'#E0A92E';ctx.lineWidth=3;ctx.stroke();ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,8,0,7);ctx.stroke();
  ctx.strokeStyle='#FFF3C4';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,10,3.6,4.6);ctx.stroke();}
function drawStar(x,y){ctx.fillStyle='rgba(255,75,92,.22)';ctx.beginPath();ctx.arc(x,y,20,0,7);ctx.fill();ctx.fillStyle='#E84B5B';ctx.strokeStyle='#A9233B';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?7:15;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.stroke();}
function pill(x,y,t,col){ctx.font='12px system-ui,sans-serif';const w=ctx.measureText(t).width+28;ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.roundRect(x,y,w,22,11);ctx.fill();ctx.fillStyle=col;ctx.beginPath();ctx.arc(x+12,y+11,5,0,7);ctx.fill();ctx.fillStyle='#3E3552';ctx.textBaseline='middle';ctx.fillText(t,x+22,y+12);return w;}
function render(){
  drawBg();
  for(const it of items){
    if(it.gone||it.taken)continue;
    if(it.coin){if(it.x===undefined)continue;(it.star?drawStar(it.x,it.y):drawCoin(it.x,it.y,it.gold));continue;}
    const sx=PX+(it.wx-S.dist),y=gy(sx);if(sx>W+80||sx<-80)continue;
    if(it.k==='r'){if(S.level===4)drawIceberg(sx,y,it.w,it.h);else if(S.level===5)drawAsteroid(sx,y,it.w,it.h);else drawRock(sx,y,it.w,it.h);}else if(it.k==='l'){if(S.level===4)drawFrozenLog(sx,y,it.w,it.h);else if(S.level===5)drawComet(sx,y,it.w,it.h);else drawLog(sx,y,it.w,it.h);}else if(it.k==='alligator')drawAlligator(sx,y,it.w,it.h,it.theme);else if(it.k==='cattle')drawCattle(sx,y,it.w,it.h,it.theme);else if(it.k==='toucan')drawToucan(sx,y-115,it.w,it.h,it.theme);else drawEnemy(sx,y-(Math.sin(S.t*4+it.bob)*10),it.w,it.h,it.theme);
  }
  const gyP=gy(PX),s=S0;
  ctx.fillStyle='rgba(62,53,82,.2)';ctx.beginPath();ctx.ellipse(PX,gyP+4,40/(1+S.z/150),6/(1+S.z/150),0,0,7);ctx.fill();
  const img=imgs[S.face>0?'triste':'feliz'];
  if(img){
    ctx.save();
    if(S.invuln>0&&Math.floor(S.t*14)%2)ctx.globalAlpha=.45;
    ctx.translate(PX,gyP-20-S.z-86*s);ctx.rotate(Math.atan(groundSlope)*0.6+(S.spin>0?(1-S.spin/0.34)*Math.PI*2:0));
    if(S.morteGray)ctx.filter='grayscale(1)';
    ctx.drawImage(img,-120*s,-116*s,240*s,240*s);ctx.filter='none';ctx.restore();
  }
  if(S.sacerAura>0){ctx.strokeStyle='#6CC38A';ctx.lineWidth=5;ctx.globalAlpha=Math.min(1,S.sacerAura/0.25);ctx.beginPath();ctx.arc(PX,gyP-67-S.z,49,0,7);ctx.stroke();ctx.globalAlpha=1;}
  if(P.lua){const px=PX,py=gyP-67-S.z;const gr=ctx.createRadialGradient(px,py,110,px,py,330);gr.addColorStop(0,'rgba(20,18,43,0)');gr.addColorStop(1,'rgba(20,18,43,.82)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);}
  if(S.flash>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(.85,S.flash*3)+')';ctx.fillRect(0,0,W,H);}
  $('tb').style.display='none';
  if(S.hudVisible){
  let x=14;const activeCards=cards.filter(c=>P[c.id]);activeCards.forEach((c,index)=>{
    if(c.id==='sacer'&&S.sacerCooldown>0){
      ctx.font='12px system-ui,sans-serif';const w=ctx.measureText(c.nome).width+28,h=22;
      ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.roundRect(x,14,w,h,11);ctx.fill();
      ctx.save();ctx.beginPath();ctx.roundRect(x,14,w,h,11);ctx.clip();
      ctx.fillStyle=c.cor;ctx.fillRect(x,14,w*(1-S.sacerCooldown/15),h);ctx.restore();
      x+=w+6;
    }else{const pw=pill(x,14,c.nome,c.cor);x+=pw+6;}
    if(index===2&&P.torre&&state==='play'&&!S.torreUsed&&!S.morteGray){
      $('tb').style.display='flex';
    }
  });

  const lives=[];if(P.forca)for(let i=0;i<3;i++)lives.push('#F28C28');else lives.push('#F28C28');if(P.imper)lives.push('#F28FB1');
  if(S.morteGray){lives.length=0;lives.push('#9A9A9A');}
  let remaining=Math.max(0,S.lives);const ly=49; lives.forEach((color,i)=>{const cx=22+i*23,fill=Math.max(0,Math.min(1,remaining));ctx.beginPath();ctx.arc(cx,ly,7,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.22)';ctx.fill();if(fill>0){ctx.save();ctx.beginPath();ctx.arc(cx,ly,7,0,Math.PI*2);ctx.clip();ctx.fillStyle=color;if(fill>=1)ctx.fillRect(cx-8,ly-8,16,16);else ctx.fillRect(cx-8,ly-8,8,16);ctx.restore();}ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,ly,7,0,Math.PI*2);ctx.stroke();remaining-=1;});
  }

}
function loop(now){
  const rdt=Math.min(.033,(now-last)/1000);last=now;
  if(state==='play'||state==='intro'){update(rdt);render();}
  requestAnimationFrame(loop);
}
S={dist:0,z:0,t:0,score:0,coins:0,face:0,invuln:0,slowE:2};
requestAnimationFrame(loop);
</script>
