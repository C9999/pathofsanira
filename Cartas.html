<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>v0.6 — Cartas — Path of Sanira</title>
<style>
:root{--bg:#14122B;--panel:#211C45;--panel2:#2E2760;--gold:#E8C46A;--cream:#F5EFE0;--muted:#CFC8E8;--line:#6B5FB5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:15px system-ui,sans-serif;padding:28px}
main{max-width:1180px;margin:auto}h1,h2{font-family:Georgia,serif;font-weight:600}h1{font-size:32px}p,.muted{color:var(--muted)}
.back{display:inline-block;margin-bottom:16px;background:var(--panel2);color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:11px 18px;text-decoration:none;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-top:22px}
.tarot-card{height:300px;background:#211C45;border:1px solid #6B5FB5;border-radius:13px;padding:11px;display:flex;flex-direction:column;gap:7px;text-align:center;box-shadow:0 5px 18px #08071955}
.tarot-top{display:flex;justify-content:center;align-items:center;min-height:17px;font:600 12px Georgia,serif;letter-spacing:.18em}
.tarot-frame{height:170px;border:1px solid;border-radius:9px;padding:7px;display:flex;justify-content:center;align-items:center;background:#191638}
.tarot-art{width:100%;height:100%;display:block}
.tarot-art .a{fill:currentColor}.tarot-art .b{fill:currentColor;fill-opacity:.55}.tarot-art .c{fill:currentColor;fill-opacity:.25}.tarot-art .k{fill:#1B1740}.tarot-art .s{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.tarot-art .sb{stroke-opacity:.55}
.tarot-name{font:600 16px/1.15 Georgia,serif;min-height:36px;display:flex;align-items:center;justify-content:center}
.tarot-pw{font:700 12px/1.2 system-ui,sans-serif}
.tarot-desc{font:11px/1.3 system-ui,sans-serif;color:var(--muted);margin:0}
@media(max-width:600px){body{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tarot-card{height:270px;padding:8px}.tarot-frame{height:145px}.tarot-name{font-size:14px}.tarot-desc{font-size:10px}}
</style>
</head>
<body>
<main>
<a class="back" href="teste.html">← Central de testes</a>
